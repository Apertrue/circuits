[package]
name = "apertrue_proof_b_ps256"
type = "bin"
authors = ["Apertrue Social"]
compiler_version = ">=1.0.0"
description = "ProofB PS256: RSA-only COSE signature verification for algorithm specialization (~160k constraints)"

[dependencies]
# RSA verification (zkpassport fork with PSS support)
noir_rsa = { tag = "v0.9.2", git = "https://github.com/zkpassport/noir_rsa" }
bignum = { tag = "v0.8.0", git = "https://github.com/noir-lang/noir-bignum" }
# SHA-256 for hash verification (sig_structure, claim hash)
sha256 = { tag = "v0.2.1", git = "https://github.com/noir-lang/sha256" }
# Poseidon2 for claim hash commitment verification
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }
