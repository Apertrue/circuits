[package]
name = "apertrue_proof_a_rsa_2048_v2"
type = "bin"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "ProofA RSA-2048 v2: P-256 or RSA-2048 leaf key and validity bound to the TBS signed by an RSA-2048 intermediate"

[dependencies]
# Leaf TBSCertificate hashing, DER walk, RSA/P-256 key extraction
cert_binding = { path = "../cert_binding" }
# RSA verification (zkpassport fork)
noir_rsa = { tag = "v0.10.0", git = "https://github.com/zkpassport/noir_rsa" }
bignum = { tag = "v0.9.2", git = "https://github.com/noir-lang/noir-bignum" }
# SHA-256 for hash chain verification
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
# Poseidon for commitment schemes
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }
