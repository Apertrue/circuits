[package]
name = "cert_binding"
type = "lib"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "Binds a leaf key and validity dates to the hash (SHA-256/384/512) of a DER TBSCertificate"

[dependencies]
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
# SHA-384 / SHA-512 for issuers that sign with ecdsa-with-SHA384/512
sha512 = { tag = "v0.1.1", git = "https://github.com/zkpassport/sha512" }
