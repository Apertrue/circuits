[package]
name = "apertrue_c2pa_verifier"
type = "bin"
authors = ["Apertrue Social"]
compiler_version = ">=1.0.0"
description = "ZK circuit for C2PA authenticity verification with privacy preservation"

[dependencies]
# RSA signature verification for Adobe PS256 signatures
noir_rsa = { tag = "v0.7.0", git = "https://github.com/noir-lang/noir_rsa" }
# BigNum library for RSA parameter construction
bignum = { tag = "v0.6.0", git = "https://github.com/noir-lang/noir-bignum" }
