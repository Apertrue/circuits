[package]
name = "apertrue_proof_b_ps256_v2"
type = "bin"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "ProofB PS256 v2: RSA-2048 PSS COSE signature by the leaf key, nullifier over the full modulus"

[dependencies]
# RSA key hashing shared with ProofA v2 (full-modulus key hash)
cert_binding = { path = "../cert_binding" }
# Shared ProofB v2 helpers (claim embedding, content hash, Merkle, packing)
proof_b_es256_v2_core = { path = "../proof_b_es256_v2_core" }
# RSA verification (zkpassport fork with PSS support)
noir_rsa = { tag = "v0.10.0", git = "https://github.com/zkpassport/noir_rsa" }
bignum = { tag = "v0.9.2", git = "https://github.com/noir-lang/noir-bignum" }
# SHA-256 for hash verification (sig_structure, claim hash)
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
# Poseidon2 for claim hash commitment verification
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }
