[package]
name = "apertrue_proof_a"
type = "bin"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "ProofA: Certificate chain verification (RSA-2048/4096, ECDSA P-256/P-384) for split-proof architecture"

[dependencies]
# Using zkpassport fork (same version as ProofB for consistency)
noir_rsa = { tag = "v0.10.0", git = "https://github.com/zkpassport/noir_rsa" }
bignum = { tag = "v0.9.2", git = "https://github.com/noir-lang/noir-bignum" }
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }

