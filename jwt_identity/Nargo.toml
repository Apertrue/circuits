[package]
name = "jwt_identity"
type = "bin"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "JWT identity verification - proves org membership from Google OAuth JWT without revealing email"

[dependencies]
# Vendored noir_jwt v0.5.1 with patched deps for beta.19 compatibility:
# noir_rsa v0.10.0 (sha512 v0.1.1 — no wrapping_add), sha256 v0.3.0, bignum v0.9.2
noir_jwt = { path = "../vendor/noir-jwt" }
