[package]
name = "apertrue_proof_b"
type = "bin"
authors = ["Apertrue Social"]
compiler_version = ">=1.0.0"
description = "ProofB: COSE signature verification + Merkle membership for split-proof architecture"

[dependencies]
# Using zkpassport fork which has PSS support (required for PS256/Adobe/ChatGPT)
noir_rsa = { tag = "v0.9.2", git = "https://github.com/zkpassport/noir_rsa" }
bignum = { tag = "v0.8.0", git = "https://github.com/noir-lang/noir-bignum" }
