[package]
name = "apertrue_proof_a_rsa_2048"
type = "bin"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "ProofA RSA-2048: Certificate chain verification for RSA-2048 only (~180k constraints)"

[dependencies]
# RSA verification (zkpassport fork)
noir_rsa = { tag = "v0.9.2", git = "https://github.com/zkpassport/noir_rsa" }
bignum = { tag = "v0.8.0", git = "https://github.com/noir-lang/noir-bignum" }
# SHA-256 for hash chain verification
sha256 = { tag = "v0.2.1", git = "https://github.com/noir-lang/sha256" }
# Poseidon for commitment schemes
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }
