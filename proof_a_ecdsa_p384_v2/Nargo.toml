[package]
name = "apertrue_proof_a_ecdsa_p384_v2"
type = "bin"
authors = ["Apertrue"]
compiler_version = ">=1.0.0"
description = "ProofA ECDSA P-384 v2: P-256 leaf key and validity bound to the TBS signed by a P-384 intermediate"

[dependencies]
# Leaf TBSCertificate hashing and DER walk
cert_binding = { path = "../cert_binding" }
# P-384 uses bignum for field operations (via vendored noir_bigcurve)
bignum = { tag = "v0.9.2", git = "https://github.com/noir-lang/noir-bignum" }
# SHA-256 for hash chain verification
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
# Poseidon for commitment schemes
poseidon = { tag = "v0.1.1", git = "https://github.com/noir-lang/poseidon" }
