name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      circuit:
        description: 'Specific circuit to build (leave empty for all)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        circuit:
          - proof_a
          - proof_a_ecdsa_p256
          - proof_a_ecdsa_p384
          - proof_a_rsa_2048
          - proof_a_rsa_4096
          - proof_a_skip
          - proof_b
          - proof_b_es256
          - proof_b_ps256
          - image_aggregator
          - tree_aggregator
          - selective_disclosure
          - credential_registration
          - anonymous_credential
          - jwt_identity

    steps:
      - uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: '1.0.0-beta.18'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ${{ matrix.circuit }}/target
          key: nargo-${{ matrix.circuit }}-${{ hashFiles(format('{0}/Nargo.toml', matrix.circuit)) }}
          restore-keys: nargo-${{ matrix.circuit }}-

      - name: Build
        working-directory: ${{ matrix.circuit }}
        run: nargo build

      - name: Test
        working-directory: ${{ matrix.circuit }}
        run: nargo test

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: circuit-${{ matrix.circuit }}
          path: ${{ matrix.circuit }}/target/*.json
          retention-days: 30
